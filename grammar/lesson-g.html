<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luyện Tập Ngữ Pháp IELTS</title>
  <link rel="stylesheet" href="css/base-g.css">
  <link rel="stylesheet" href="css/components-g.css">
  <link rel="stylesheet" href="css/exercise-g.css">
</head>
<body>

<div class="container-g" id="appContainer">
  <a href="index-g.html" class="nav-back-g">&larr; Trở về danh mục chuyên đề</a>
</div>

<!-- ========================================== -->
<!-- ĐÂY CHÍNH LÀ CHỖ THÊM ĐOẠN CODE ĐÓ VÀO NÈ -->
<!-- ========================================== -->
<script type="module">
  import { LessonRenderer } from './js/lesson-renderer-g.js';

  async function initLesson() {
    const appContainer = document.getElementById('appContainer');
    
    // 1. Lấy tên thì từ đường dẫn URL (ví dụ: lesson-g.html?tense=present-simple)
    // Mặc định nếu không ghi gì sẽ tải thì hiện tại đơn
    const urlParams = new URLSearchParams(window.location.search);
    const tense = urlParams.get('tense') || 'present-simple';

    try {
      // 2. Tải đồng thời CẢ 2 FILE: lý thuyết và bài tập từ thư mục data
      const [theoryRes, exerciseRes] = await Promise.all([
        fetch(`data/${tense}/theory-${tense}-g.json`),
        fetch(`data/${tense}/exercises-${tense}-g.json`)
      ]);

      if (!theoryRes.ok || !exerciseRes.ok) {
        throw new Error("Không thể tìm thấy file JSON lý thuyết hoặc bài tập.");
      }

      const theoryData = await theoryRes.json();
      const exerciseData = await exerciseRes.json();

      // 3. Gửi cả 2 dữ liệu vào LessonRenderer để tự vẽ giao diện và chấm điểm
      const renderer = new LessonRenderer(appContainer, theoryData, exerciseData);
      renderer.renderAll();

    } catch (err) {
      console.error(err);
      appContainer.innerHTML += `
        <div style="background:#fee2e2; color:#991b1b; padding:20px; border-radius:8px; margin-top:20px;">
          <h3>⚠️ Lỗi tải dữ liệu bài học</h3>
          <p>Không thể tải dữ liệu cho thì: <b>${tense}</b>.</p>
          <p>Hãy đảm bảo bạn đã tạo đủ 2 file:</p>
          <ul>
            <li><code>grammar/data/${tense}/theory-${tense}-g.json</code></li>
            <li><code>grammar/data/${tense}/exercises-${tense}-g.json</code></li>
          </ul>
        </div>
      `;
    }
  }

  // Khởi động chạy trang web
  initLesson();
</script>

</body>
</html>
