<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trạm Ngữ Pháp IELTS Toàn Diện</title>
  <link rel="stylesheet" href="css/base-g.css">
  <link rel="stylesheet" href="css/components-g.css">
</head>
<body>

<div class="container-g">
  <!-- Hero Bar -->
  <div class="header-hero-g">
    <div>
      <a href="../index (5).html" style="color: #99f6e4; text-decoration: none; font-size: 13px; font-weight: 700;">&larr; Quay lại Trang Chủ IELTS</a>
      <h1 style="margin: 8px 0 4px 0; font-size: 26px;">📚 TRẠM NGỮ PHÁP TIẾNG ANH & IELTS</h1>
      <p style="margin: 0; opacity: 0.9; font-size: 14px;">15 Chuyên đề ngữ pháp cốt lõi từ cơ bản đến nâng cao</p>
    </div>
    <div style="background: rgba(255,255,255,0.15); padding: 10px 18px; border-radius: 8px; text-align: right;">
      <span style="font-size: 12px; display: block; opacity: 0.85;">Tiến độ hoàn thành:</span>
      <b id="overallProgressDisplay" style="font-size: 20px;">0 / 15 Bài</b>
    </div>
  </div>

  <!-- Danh sách 15 Chuyên Đề -->
  <div class="card-grid-g" id="catalogGrid"></div>
</div>

<script type="module">
  import { GRAMMAR_CATALOG } from './data/index-data-g.js';
  import { grammarState } from './js/state-g.js';

  function renderCatalogue() {
    const grid = document.getElementById('catalogGrid');
    const userProgress = grammarState.getProgress();
    let completedCount = 0;

    grid.innerHTML = GRAMMAR_CATALOG.map(item => {
      const isPassed = userProgress[item.id]?.passed;
      if (isPassed) completedCount++;

      return `
        <div class="lesson-card-g">
          <div>
            <span class="badge-tag-g">${item.badge}</span>
            <h3 style="margin: 0 0 8px 0; font-size: 17px; color: #134e4a;">${item.title}</h3>
            <p style="margin: 0 0 16px 0; font-size: 13.5px; color: var(--text-muted);">${item.desc}</p>
          </div>
          <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px dashed var(--border-color); padding-top: 14px;">
            <span style="font-size: 12.5px; font-weight: 600; color: ${isPassed ? '#16a34a' : '#64748b'};">
              ${isPassed ? `✅ Đã đạt (${userProgress[item.id].percent}%)` : `⏳ Chưa hoàn thành`}
            </span>
            <a href="lesson-g.html?topic=${item.id}" class="btn-action-g">Vào Học ➔</a>
          </div>
        </div>
      `;
    }).join('');

    document.getElementById('overallProgressDisplay').innerText = `${completedCount} / ${GRAMMAR_CATALOG.length} Bài`;
  }

  renderCatalogue();
</script>
</body>
</html>
