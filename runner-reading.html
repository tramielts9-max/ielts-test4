<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>IELTS Reading Examination</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/reading.css">
</head>
<body>

<div class="user-info-box">
  <div class="user-info-field">
    <label for="studentNameInput">👤 Họ và Tên:</label>
    <input type="text" id="studentNameInput" placeholder="Đang đồng bộ họ tên...">
  </div>
  <div class="user-info-field">
    <label for="studentEmailInput">✉️ Email Google:</label>
    <input type="email" id="studentEmailInput" placeholder="Đang đồng bộ Email...">
  </div>
</div>

<div class="header-bar">
  <h1 id="testTitleHeader">IELTS Reading Test</h1>
  <div class="header-nav"><a href="index.html" class="nav-link">🏠 Trang chủ</a></div>
  <div class="header-controls">
    <button class="btn-header" onclick="changeFontSize(-1)">A-</button>
    <button class="btn-header" onclick="changeFontSize(1)">A+</button>
    <button class="btn-header" id="btnThemeToggle" onclick="toggleTheme()">🌙 Tối/Sáng</button>
  </div>
  <div class="timer-container">
    <span>⏱️ Thời gian:</span>
    <span class="timer-display" id="timerDisplay">00:00</span>
    <button class="btn-timer" onclick="startTimer()">▶️ Bắt đầu</button>
    <button class="btn-timer" onclick="pauseTimer()">⏸️ Tạm dừng</button>
  </div>
  <div class="score-badge" id="scoreBadge">Điểm số: <span id="scoreText">0/13</span></div>
</div>

<div class="container" id="mainContainer">
  <div class="passage-box" id="passageBox">
    <div style="text-align:center; padding: 40px; color: var(--text-muted);">⏳ Đang tải nội dung bài đọc...</div>
  </div>
  <div class="resizer" id="dragResizer"></div>
  <div class="question-box" id="questionBox">
    <div style="text-align:center; padding: 40px; color: var(--text-muted);">⏳ Đang tải câu hỏi...</div>
  </div>
</div>

<script type="module">
  import { stateManager } from './js/state.js';

  const params = new URLSearchParams(window.location.search);
  let testId = params.get('test');

  if (!testId) {
    alert("⚠️ Không tìm thấy mã đề thi!");
    window.location.href = 'index.html';
  } else {
    async function loadTest() {
      // Làm sạch tên file
      const raw = testId.replace(/\.json$/i, '');
      const fileName = raw.includes('/') ? raw.split('/').pop() : raw;

      // Tự động đoán tên Folder từ tên file (ví dụ: cam21-test3-p1 -> folder: cam21-test3)
      const folderName = fileName.replace(/-p\d+.*$/i, '');

      // Danh sách các đường dẫn quét tự động theo cấu trúc của bạn
      const urlsToTry = [
        `data/${folderName}/${fileName}.json`,   // data/cam21-test3/cam21-test3-p1.json (ĐÚNG CỦA BẠN)
        `data/${raw}.json`,
        `${raw}.json`,
        `data/${fileName}.json`,
        `${fileName}.json`
      ];

      let data = null;
      let successUrl = '';
      const logs = [];

      for (const url of urlsToTry) {
        try {
          const res = await fetch(`${url}?t=${Date.now()}`, { cache: 'no-store' });
          logs.push({ url, status: res.status });
          if (res.ok) {
            data = await res.json();
            successUrl = url;
            break;
          }
        } catch (e) {
          logs.push({ url, status: 'Error' });
        }
      }

      if (!data) {
        document.getElementById('mainContainer').innerHTML = `
          <div style="padding: 30px; max-width: 700px; margin: 0 auto;">
            <h3 style="color: #dc2626;">❌ Không tìm thấy file bài thi!</h3>
            <p>Trình duyệt đã thử tìm ở các địa chỉ này nhưng không thấy:</p>
            <ul>
              ${logs.map(l => `<li><a href="${l.url}" target="_blank">${l.url}</a> (Mã lỗi: ${l.status})</li>`).join('')}
            </ul>
            <a href="index.html" class="nav-link" style="display:inline-block; margin-top:10px;">Quay về trang chủ</a>
          </div>
        `;
        return;
      }

      // Đổ dữ liệu vào trang
      document.title = data.title;
      document.getElementById('testTitleHeader').innerText = data.title;
      document.getElementById('passageBox').innerHTML = data.passageHtml || data.transcriptHtml || "";
      document.getElementById('questionBox').innerHTML = data.questionHtml || "";
      window.TEST_DATA = { title: data.title, answers: data.answers };

      await import('./js/app.js');
    }

    loadTest();
  }
</script>
</body>
</html>
