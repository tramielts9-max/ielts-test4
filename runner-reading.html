<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>IELTS Reading Examination</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/reading.css">
</head>
<body>

<div class="user-info-box">
  <div class="user-info-field">
    <label for="studentNameInput">👤 Họ và Tên:</label>
    <input type="text" id="studentNameInput" placeholder="Đang đồng bộ họ tên...">
  </div>
  <div class="user-info-field">
    <label for="studentEmailInput">✉️ Email Google:</label>
    <input type="email" id="studentEmailInput" placeholder="Đang đồng bộ Email...">
  </div>
</div>

<div class="header-bar">
  <h1 id="testTitleHeader">IELTS Reading Test</h1>
  <div class="header-nav"><a href="index.html" class="nav-link">🏠 Trang chủ</a></div>
  <div class="header-controls">
    <button class="btn-header" onclick="changeFontSize(-1)">A-</button>
    <button class="btn-header" onclick="changeFontSize(1)">A+</button>
    <button class="btn-header" id="btnThemeToggle" onclick="toggleTheme()">🌙 Tối/Sáng</button>
  </div>
  <div class="timer-container">
    <span>⏱️ Thời gian:</span>
    <span class="timer-display" id="timerDisplay">00:00</span>
    <button class="btn-timer" onclick="startTimer()">▶️ Bắt đầu</button>
    <button class="btn-timer" onclick="pauseTimer()">⏸️ Tạm dừng</button>
  </div>
  <div class="score-badge" id="scoreBadge">Điểm số: <span id="scoreText">0/13</span></div>
</div>

<div class="container" id="mainContainer">
  <div class="passage-box" id="passageBox">
    <div style="text-align:center; padding: 40px; color: var(--text-muted);">⏳ Đang tải nội dung bài đọc...</div>
  </div>
  <div class="resizer" id="dragResizer"></div>
  <div class="question-box" id="questionBox">
    <div style="text-align:center; padding: 40px; color: var(--text-muted);">⏳ Đang tải câu hỏi...</div>
  </div>
</div>

<script type="module">
  import { stateManager } from './js/state.js';

  const params = new URLSearchParams(window.location.search);
  let testId = params.get('test');

  if (!testId) {
    alert("⚠️ Không tìm thấy mã đề thi!");
    window.location.href = 'index.html';
  } else {
    async function loadTest() {
      const cleanId = testId.replace(/\.json$/i, '');
      const hyphenatedId = cleanId.replace(/\//g, '-');

      // Danh sách các khả năng đường dẫn
      const testNames = [hyphenatedId, cleanId];
      const prefixes = ['', 'data/', 'data/tests/', 'tests/'];

      const urlsToTry = [];
      for (const prefix of prefixes) {
        for (const name of testNames) {
          const path = `${prefix}${name}.json`;
          if (!urlsToTry.includes(path)) urlsToTry.push(path);
        }
      }

      let data = null;
      let successUrl = '';
      const attemptedLogs = [];

      for (const url of urlsToTry) {
        try {
          // Thêm timestamp để ép trình duyệt KHÔNG ĐƯỢC LẤY CACHE CŨ
          const fetchUrl = `${url}?t=${Date.now()}`;
          const res = await fetch(fetchUrl, { cache: 'no-store' });
          attemptedLogs.push({ url, status: res.status });
          
          if (res.ok) {
            data = await res.json();
            successUrl = url;
            break;
          }
        } catch (e) {
          attemptedLogs.push({ url, status: 'Lỗi mạng/CORS' });
        }
      }

      if (!data) {
        let logHtml = attemptedLogs.map(l => 
          `<li style="margin-bottom:6px;">
            <a href="${l.url}" target="_blank" style="color:#0284c7; font-weight:600;">${l.url}</a> 
            👉 Trạng thái: <b style="color:${l.status === 404 ? '#ef4444' : '#eab308'};">${l.status}</b>
          </li>`
        ).join('');

        document.getElementById('mainContainer').innerHTML = `
          <div style="padding: 30px; max-width: 750px; margin: 0 auto; line-height: 1.6;">
            <h3 style="color: #dc2626; margin-top:0;">❌ Không tìm thấy file: <code>${hyphenatedId}.json</code></h3>
            <p>Trình duyệt đã tìm ở các vị trí sau nhưng đều nhận kết quả không tìm thấy:</p>
            <ul style="background: var(--bg-subcard); padding: 15px 25px; border-radius: 8px; font-family: monospace;">
              ${logHtml}
            </ul>
            <div style="background: #fef2f2; border: 1px solid #fecaca; padding: 12px 16px; border-radius: 6px; font-size: 14px; margin-top: 15px;">
              💡 <b>Mẹo kiểm tra nhanh:</b><br>
              1. Bấm thử vào từng đường link màu xanh ở trên.<br>
              2. Nếu link nào mở ra trang <i>404 Not Found</i> của GitHub, nghĩa là trên GitHub file đó chưa được lưu đúng tên hoặc chưa deploy xong.<br>
              3. Hãy kiểm tra lại thư mục chứa file trong tab GitHub của bạn (trong ảnh trước là bạn đang mở thư mục <code>data/</code>, hãy xem file nằm ngay trong <code>data/</code> hay có nằm trong thư mục con nào nữa không).
            </div>
            <p style="text-align: center; margin-top: 20px;">
              <a href="index.html" class="nav-link" style="display:inline-block;">Quay về trang chủ</a>
            </p>
          </div>
        `;
        return;
      }

      // Đổ dữ liệu vào trang khi tìm thấy
      document.title = data.title;
      document.getElementById('testTitleHeader').innerText = data.title;
      document.getElementById('passageBox').innerHTML = data.passageHtml || data.transcriptHtml || "";
      document.getElementById('questionBox').innerHTML = data.questionHtml || "";
      window.TEST_DATA = { title: data.title, answers: data.answers };

      await import('./js/app.js');
    }

    loadTest();
  }
</script>
</body>
</html>
