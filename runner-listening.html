<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>IELTS Listening Examination</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/listening.css">
</head>
<body class="listening-test">

<div class="user-info-box">
  <div class="user-info-field">
    <label for="studentNameInput">👤 Họ và Tên:</label>
    <input type="text" id="studentNameInput" placeholder="Đang đồng bộ họ tên...">
  </div>
  <div class="user-info-field">
    <label for="studentEmailInput">✉️ Email Google:</label>
    <input type="email" id="studentEmailInput" placeholder="Đang đồng bộ Email...">
  </div>
</div>

<div class="header-bar">
  <h1 id="testTitleHeader">IELTS Listening Test</h1>
  <div class="header-nav"><a href="index.html" class="nav-link">🏠 Trang chủ</a></div>
  <div class="header-controls">
    <button class="btn-header" onclick="changeFontSize(-1)">A-</button>
    <button class="btn-header" onclick="changeFontSize(1)">A+</button>
    <button class="btn-header" id="btnThemeToggle" onclick="toggleTheme()">🌙 Tối/Sáng</button>
  </div>
  <div class="timer-container">
    <span>⏱️ Thời gian:</span>
    <span class="timer-display" id="timerDisplay">00:00</span>
    <button class="btn-timer" onclick="startTimer()">▶️ Bắt đầu</button>
    <button class="btn-timer" onclick="pauseTimer()">⏸️ Tạm dừng</button>
  </div>
  <div class="score-badge" id="scoreBadge">Điểm số: <span id="scoreText">0/10</span></div>
</div>

<div class="container" id="mainContainer">
  <div class="passage-box" id="passageBox"></div>
  <div class="resizer" id="dragResizer"><div class="resizer-icon">◄►</div></div>
  <div class="question-box" id="questionBox"></div>
</div>

<script type="module">
  import { stateManager } from './js/state.js';

  const params = new URLSearchParams(window.location.search);
  let testId = params.get('test');

  if (!testId) {
    alert("⚠️ Không tìm thấy mã đề thi!");
    window.location.href = 'index.html';
  } else {
    async function loadTest() {
      const raw = testId.replace(/\.json$/i, '');
      const fileName = raw.includes('/') ? raw.split('/').pop() : raw;
      const folderName = fileName.replace(/-p\d+.*$/i, '');

      const urlsToTry = [
        `data/${folderName}/${fileName}.json`,   // data/cam21-lis-test1/cam21-lis-test1-p2.json
        `data/${raw}.json`,
        `${raw}.json`,
        `data/${fileName}.json`,
        `${fileName}.json`
      ];

      let data = null;
      for (const url of urlsToTry) {
        try {
          const res = await fetch(`${url}?t=${Date.now()}`, { cache: 'no-store' });
          if (res.ok) {
            data = await res.json();
            break;
          }
        } catch (e) {}
      }

      if (!data) {
        document.getElementById('mainContainer').innerHTML = `
          <div style="padding: 30px; text-align: center; width: 100%;">
            <h3 style="color: #dc2626;">❌ Không tìm thấy file: <code>${fileName}.json</code></h3>
            <a href="index.html" class="nav-link" style="display:inline-block; margin-top:10px;">Quay về trang chủ</a>
          </div>
        `;
        return;
      }

      document.title = data.title;
      document.getElementById('testTitleHeader').innerText = data.title;
      document.getElementById('passageBox').innerHTML = data.passageHtml || data.transcriptHtml || "";
      document.getElementById('questionBox').innerHTML = data.questionHtml || "";
      window.TEST_DATA = { title: data.title, answers: data.answers };

      await import('./js/app.js');
    }

    loadTest();
  }
</script>
</body>
</html>
