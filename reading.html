<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IELTS Reading Practice - Cambridge 17 to 21</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .reading-hero {
      background: linear-gradient(135deg, #8B1518 0%, #1e1b4b 100%);
      color: white; padding: 28px 20px; text-align: center; border-radius: 12px; margin-bottom: 22px;
      box-shadow: 0 8px 20px rgba(139, 21, 24, 0.25);
    }
    .top-nav-bar {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
    }
    .cam-tabs-bar {
      display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px;
      background: var(--bg-card); padding: 10px 14px; border-radius: 10px; border: 1px solid var(--border-color);
    }
    .cam-tab-btn {
      background: var(--bg-subcard); border: 1.5px solid var(--border-color); color: var(--text-main);
      padding: 8px 18px; border-radius: 8px; font-weight: 700; font-size: 14px; cursor: pointer; transition: all 0.2s;
    }
    .cam-tab-btn:hover { border-color: #8B1518; color: #8B1518; }
    .cam-tab-btn.active {
      background: #8B1518; border-color: #8B1518; color: #ffffff !important;
      box-shadow: 0 4px 10px rgba(139, 21, 24, 0.3);
    }

    .test-heading {
      font-size: 17px; font-weight: 800; color: #0f172a; margin: 28px 0 14px 0;
      padding-bottom: 6px; border-bottom: 2.5px solid #8B1518;
    }
    .test-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 18px; margin-bottom: 15px;
    }
    .test-card {
      background: #ffffff; border: 1.5px solid #e2e8f0; border-radius: 10px; padding: 18px;
      display: flex; flex-direction: column; justify-content: space-between; min-height: 185px;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .test-card:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(0,0,0,0.08); }
    .badge-reading {
      display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 12px;
      font-size: 12px; font-weight: 700; background: #fee2e2; color: #8B1518; margin-bottom: 10px; width: fit-content;
    }
    .card-title { color: #8B1518; font-size: 15.5px; font-weight: 800; margin: 0 0 6px 0; line-height: 1.4; }
    .card-desc { font-size: 13px; color: #64748b; margin: 0 0 16px 0; line-height: 1.5; }
    .btn-play {
      display: flex; align-items: center; justify-content: center; gap: 6px; background: #8B1518;
      color: #ffffff; text-decoration: none; padding: 10px 16px; border-radius: 6px; font-weight: 700; font-size: 14px;
      transition: background 0.2s;
    }
    .btn-play:hover { background: #6b0f11; }
  </style>
</head>
<body>

<div style="max-width: 1200px; margin: auto; padding: 15px;">
  <!-- HEADER -->
  <div class="reading-hero">
    <h1 style="margin: 0 0 6px 0; font-size: 24px;">📖 PHÒNG LUYỆN THI IELTS READING</h1>
    <p style="margin: 0; opacity: 0.9; font-size: 14px;">Trọn bộ Cambridge 17 - 21 • Chấm điểm tức thì • Trợ giảng AI giải thích chi tiết</p>
  </div>

  <div class="top-nav-bar">
    <a href="index.html" class="btn-header" style="background: var(--bg-card); color: var(--text-main); border: 1px solid var(--border-color); text-decoration: none; display: inline-flex; align-items: center; gap: 6px;">
      🏠 Về Trung Tâm Điều Hành
    </a>
    <span id="userStatusTag" style="font-size: 13px; color: var(--text-muted); font-weight: 600;"></span>
  </div>

  <!-- TABS CHỌN CAMBRIDGE -->
  <div class="cam-tabs-bar">
    <span style="font-weight: 800; font-size: 14px; margin-right: 6px; display: flex; align-items: center;">Bộ Sách:</span>
    <button type="button" class="cam-tab-btn active" onclick="switchCam(21)">Cambridge 21</button>
    <button type="button" class="cam-tab-btn" onclick="switchCam(20)">Cambridge 20</button>
    <button type="button" class="cam-tab-btn" onclick="switchCam(19)">Cambridge 19</button>
    <button type="button" class="cam-tab-btn" onclick="switchCam(18)">Cambridge 18</button>
    <button type="button" class="cam-tab-btn" onclick="switchCam(17)">Cambridge 17</button>
    <button type="button" class="cam-tab-btn" onclick="switchCam('all')">Xem Tất Cả</button>
  </div>

  <!-- CONTAINER DANH SÁCH BÀI THI -->
  <div id="readingCatalogContainer"></div>
</div>

            { p: 3, title: "The Globemakers", desc: "Summary Completion, Yes/No/Not Given, Multiple Choice" }
          ]
        }
      ]
    },
    {

      tests: [
        {
          testNum: 1,
          passages: [
            { p: 1, title: "The kākāpō", desc: "Notes Completion, True/False/Not Given" },
            { p: 2, title: "Bringing elms to Britain", desc: "Matching Information, Summary Completion" },
            { p: 3, title: "How stress affects our judgement", desc: "Multiple Choice, Yes/No/Not Given" }
          ]
        },
        {

            { p: 1, title: "Manatees", desc: "True/False/Not Given, Diagram Labelling" },

        {

    {
      cam: 17,
      tests: [
        {
          testNum: 1,
          passages: [
            { p: 1, title: "The development of the London Underground railway", desc: "Notes Completion, True/False/Not Given" },

            { p: 3, title: "To catch a king", desc: "Multiple Choice, Yes/No/Not Given" }
          ]
        },
        {
          testNum: 2,
          passages: [
            { p: 1, title: "The Dead Sea Scrolls", desc: "True/False/Not Given, Table Completion" },
            { p: 2, title: "A second attempt at domesticating the tomato", desc: "Matching Headings, Sentence Completion" },

          ]
        },
        {

          passages: [
            { p: 1, title: "The thylacine", desc: "Notes Completion, True/False/Not Given" },
            { p: 2, title: "Palm oil", desc: "Summary Completion, Multiple Choice" },
            { p: 3, title: "Building the Skyline: The Birth and Growth of Manhattan's Skyscrapers", desc: "Matching Features, Yes/No/Not Given" }
          ]
        },
        {
          testNum: 4,
          passages: [
            { p: 1, title: "Bats to the rescue", desc: "True/False/Not Given, Flow-chart, Notes" },
            { p: 2, title: "Does education fuel economic growth?", desc: "Matching Information, Notes Completion" },
            { p: 3, title: "Timur Gareyev – blindfold chess champion", desc: "Multiple Choice, Summary Completion" }
          ]
        }
      ]
    }
  ];

  let currentCam = 21;

  const user = stateManager.getUser();
  if (user && user.email) {
    document.getElementById('userStatusTag').innerText = `👤 Học viên: ${user.name || user.email}`;
  }

  window.switchCam = (cam) => {
    currentCam = cam;
    document.querySelectorAll('.cam-tab-btn').forEach(b => {
      if (cam === 'all') {
        b.classList.toggle('active', b.innerText.includes('Xem Tất Cả'));
      } else {
        b.classList.toggle('active', b.innerText.includes(`Cambridge ${cam}`));
      }
    });
    renderUI();
  };

  function renderUI() {
    const container = document.getElementById('readingCatalogContainer');
    const filtered = (currentCam === 'all') 
      ? CAM_DATA 
      : CAM_DATA.filter(item => item.cam === currentCam);

    let html = '';
    filtered.forEach(camItem => {
      camItem.tests.forEach(test => {
        html += `
          <div class="test-heading">
            📖 Cambridge IELTS ${camItem.cam} - Academic Reading Test ${test.testNum}
          </div>
          <div class="test-grid">
        `;

        test.passages.forEach(psg => {
          const testUrl = `runner-reading.html?test=data/cam${camItem.cam}-test${test.testNum}/cam${camItem.cam}-test${test.testNum}-p${psg.p}.json`;
          html += `
            <div class="test-card">
              <div>
                <span class="badge-reading">📖 Passage ${psg.p}</span>
                <h4 class="card-title">${psg.title}</h4>
                <div class="card-desc">${psg.desc}</div>
              </div>
              <a href="${testUrl}" class="btn-play">
                <span>▶</span> Làm Bài Đọc
              </a>
            </div>
          `;
        });

        html += `</div>`;
      });
    });

    container.innerHTML = html;
  }

  renderUI();
</script>
</body>
</html>
