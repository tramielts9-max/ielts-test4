<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cổng Luyện Thi IELTS Trực Tuyến</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <style>
    .portal-hero {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
      color: white; padding: 35px 20px; text-align: center; border-radius: 12px; margin-bottom: 25px;
    }
    .user-dashboard-bar {
      background: var(--bg-card); border: 1px solid var(--border-color); padding: 16px 20px; border-radius: 10px;
      margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
    }
    .history-section {
      background: var(--bg-card); border: 1.5px solid var(--border-color); border-radius: 10px; padding: 18px; margin-bottom: 30px;
    }
    .score-pill { background: #16a34a; color: white; padding: 3px 10px; border-radius: 20px; font-weight: 700; font-size: 13px; }
    .btn-review { background: #0284c7; color: white; text-decoration: none; padding: 5px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; }
    .test-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 35px; }
    .test-card { background: var(--bg-card); border-radius: 10px; padding: 20px; border: 1px solid var(--border-color); display: flex; flex-direction: column; justify-content: space-between; }
    .badge { display: inline-block; padding: 3px 8px; border-radius: 12px; font-size: 12px; font-weight: bold; margin-bottom: 8px; }
    .badge-reading { background: #e0f2fe; color: #0369a1; }
    .badge-listening { background: #fef3c7; color: #b45309; }
    .btn-start-test { display: block; text-align: center; padding: 10px; border-radius: 6px; font-weight: 700; text-decoration: none; color: white; background: #0284c7; margin-top: 15px; }
    .btn-start-test.lis { background: #d97706; }
  </style>
</head>
<body>

<div style="max-width: 1200px; margin: auto; padding: 15px;">
  <div class="portal-hero">
    <h1 style="margin:0 0 8px 0; font-size: 24px;">📚 CỔNG LUYỆN THI IELTS PRACTICE TESTS</h1>
    <p style="margin:0; opacity: 0.9;">Tự động chấm điểm • AI Trợ giảng giải thích • Lưu bảng điểm Google Drive</p>
  </div>

  <!-- 1. CỔNG ĐĂNG NHẬP -->
  <div id="authGateBox" class="user-info-box" style="max-width: 550px; margin: 0 auto 30px auto; padding: 24px; display: flex; flex-direction: column; gap: 12px;">
    <h3 style="margin: 0; text-align: center;">👤 Đăng Nhập Học Viên</h3>
    <p style="margin: 0; font-size: 13.5px; color: var(--text-muted); text-align: center;">Nhập thông tin 1 lần để mở khóa bài thi và đồng bộ lịch sử:</p>
    <input type="text" id="loginNameInput" placeholder="Họ và tên..." style="padding: 10px; border: 1px solid var(--border-color); border-radius: 6px;">
    <input type="email" id="loginEmailInput" placeholder="Email Google..." style="padding: 10px; border: 1px solid var(--border-color); border-radius: 6px;">
    <button type="button" class="btn-submit" onclick="handleStudentLogin()" style="margin-top: 5px; padding: 10px;">🚀 Bắt Đầu Học Ngay</button>
  </div>

  <!-- 2. KHU VỰC ĐÃ ĐĂNG NHẬP -->
  <div id="unlockedContentBox" style="display: none;">
    <!-- Thanh thông tin học viên -->
    <div class="user-dashboard-bar">
      <div>
        <h4 style="margin: 0; font-size: 16px;" id="userNameDisplay">Học viên</h4>
        <p style="margin: 2px 0 0 0; font-size: 13px; color: var(--text-muted);" id="userEmailDisplay">email@gmail.com</p>
      </div>
      <button type="button" class="btn-header" style="background:#fee2e2; color:#dc2626; border-color:#fca5a5;" onclick="handleStudentLogout()">🚪 Đổi tài khoản</button>
    </div>

    <!-- KHUNG LỊCH SỬ BÀI LÀM (ACCORDION THEO NGÀY) -->
    <div class="history-section">
      <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 12px;">
        <h3 style="margin: 0; font-size: 17px;">📜 Lịch sử các lần làm bài <span id="totalAttemptsBadge" style="font-size: 12px; background: #e0f2fe; color: #0284c7; padding: 2px 8px; border-radius: 12px;">0 bài</span></h3>
      </div>
      <div id="historyResultsList"><div style="text-align:center; padding:12px; color:var(--text-muted);">⏳ Đang đồng bộ lịch sử từ Google Drive...</div></div>
    </div>

    <!-- DANH MỤC ĐỀ THI -->
    <div id="catalogContainer"></div>
  </div>
</div>

<script type="module">
  import { CONFIG } from './js/config.js';
  import { stateManager } from './js/state.js';

  window.handleStudentLogin = () => {
    const name = document.getElementById('loginNameInput').value.trim();
    const email = document.getElementById('loginEmailInput').value.trim().toLowerCase();
    if (!email) { alert("⚠️ Vui lòng nhập Email để hệ thống lưu bảng điểm!"); return; }
    stateManager.saveUser(name || 'Học viên', email);
    checkAuthStatus();
  };

  window.handleStudentLogout = () => {
    if (confirm("Em có muốn đổi tài khoản học viên khác không?")) {
      localStorage.removeItem(CONFIG.STORAGE_KEYS.STUDENT_NAME);
      localStorage.removeItem(CONFIG.STORAGE_KEYS.STUDENT_EMAIL);
      checkAuthStatus();
    }
  };

  function checkAuthStatus() {
    const user = stateManager.getUser();
    if (user.email) {
      document.getElementById('authGateBox').style.display = 'none';
      document.getElementById('unlockedContentBox').style.display = 'block';
      document.getElementById('userNameDisplay').innerText = user.name || 'Học viên';
      document.getElementById('userEmailDisplay').innerText = user.email;
      
      // Khởi chạy đồng bộ lịch sử và load catalog đề
      syncAndRenderHistory(user.email);
      loadCatalog();
    } else {
      document.getElementById('authGateBox').style.display = 'flex';
      document.getElementById('unlockedContentBox').style.display = 'none';
    }
  }

  // ==========================================================================
  // CƠ CHẾ LƯU KÉP: HIỆN NGAY TỪ LOCAL -> ĐỒNG BỘ NGẦM TỪ DRIVE
  // ==========================================================================
  async function syncAndRenderHistory(email) {
    const resultsBox = document.getElementById('historyResultsList');
    
    // BƯỚC 1: Đọc ngay lịch sử đã lưu tại LocalStorage (HIỆN NGAY 0.01 GIÂY)
    let localAttempts = [];
    try {
      const raw = localStorage.getItem('ielts_local_history');
      if (raw) {
        localAttempts = JSON.parse(raw).filter(a => !a.studentEmail || a.studentEmail.toLowerCase() === email.toLowerCase());
      }
    } catch(e) {}

    if (localAttempts.length > 0) {
      renderHistoryUI(localAttempts, email);
    } else {
      resultsBox.innerHTML = `<div style="text-align:center; padding:15px; color:var(--text-muted);">⏳ Đang đồng bộ lịch sử từ Google Drive...</div>`;
    }

    // BƯỚC 2: Gọi lên Google Drive để lấy toàn bộ bài làm trên các máy khác về
    if (!CONFIG.DRIVE_STORAGE_URL) return;

    try {
      const res = await fetch(CONFIG.DRIVE_STORAGE_URL, {
        method: "POST",
        body: JSON.stringify({ action: "get_history", email: email })
      });

      const rawText = await res.text();
      let data = null;
      try {
        data = JSON.parse(rawText);
      } catch(err) {
        console.warn("⚠️ Google Apps Script trả về chuỗi không phải JSON (có thể do lỗi phân quyền Apps Script):", rawText);
      }

      if (data && data.attempts) {
        const driveAttempts = data.attempts;
        
        // Hợp nhất dữ liệu giữa Cloud và Local (loại bỏ trùng lặp id)
        const map = new Map();
        [...localAttempts, ...driveAttempts].forEach(item => {
          if (item && item.id) map.set(item.id, item);
        });
        const merged = Array.from(map.values()).sort((a, b) => (b.id || '').localeCompare(a.id || ''));

        // Cập nhật ngược lại vào LocalStorage
        localStorage.setItem('ielts_local_history', JSON.stringify(merged));

        // Vẽ lại giao diện đầy đủ nhất
        renderHistoryUI(merged, email);
      }
    } catch (e) {
      console.error("Lỗi kết nối Google Drive:", e);
      // Nếu lỗi mạng, nếu đã có bài ở Local thì giữ nguyên, nếu chưa có thì báo học viên
      if (localAttempts.length === 0) {
        resultsBox.innerHTML = `
          <div style="text-align:center; padding:14px; color:var(--text-muted); font-size:13.5px;">
            ℹ️ Chưa có kết nối đến Cloud Drive. Các bài em làm tiếp theo sẽ được tự động lưu an toàn tại máy này nhé!
          </div>
        `;
      }
    }
  }

  function renderHistoryUI(attempts, email) {
    const resultsBox = document.getElementById('historyResultsList');
    document.getElementById('totalAttemptsBadge').innerText = `${attempts.length} bài`;

    if (attempts.length === 0) {
      resultsBox.innerHTML = `<div style="text-align:center; padding:14px; color:var(--text-muted); font-size:14px;">ℹ️ Em chưa có bài làm nào. Hãy chọn đề bên dưới để luyện tập nhé!</div>`;
      return;
    }

    // Gom nhóm theo ngày làm bài
    const groups = {};
    attempts.forEach(att => {
      let datePart = "Gần đây";
      const m = att.timestamp?.match(/(\d{2}\/\d{2}\/\d{4})/);
      if (m) datePart = m[1];
      if (!groups[datePart]) groups[datePart] = [];
      groups[datePart].push(att);
    });

    let html = '';
    for (const date in groups) {
      html += `
        <div style="margin-bottom: 12px; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; background: var(--bg-card);">
          <div style="padding: 8px 14px; background: #f8fafc; font-weight: bold; font-size: 13.5px; border-bottom: 1px solid var(--border-color);">
            📅 Ngày ${date} (${groups[date].length} bài)
          </div>
          <div style="padding: 6px 14px;">
      `;
      groups[date].forEach(att => {
        const separator = att.pageUrl.includes('?') ? '&' : '?';
        const reviewLink = `${att.pageUrl}${separator}attemptId=${att.id}&email=${encodeURIComponent(email)}`;

        html += `
          <div style="display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px dashed var(--border-color); flex-wrap: wrap; gap: 8px;">
            <div>
              <b style="color: var(--text-main); font-size: 14px;">📖 ${att.testTitle}</b>
              <div style="font-size: 12.5px; color: var(--text-muted); margin-top: 2px;">
                ⏱️ Nộp lúc: <b>${att.timestamp}</b> • Thời gian làm: <b>${att.timeSpent || 'N/A'}</b>
              </div>
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
              <span class="score-pill">Điểm: ${att.score}</span>
              <a href="${reviewLink}" class="btn-review">👁️ Xem lại bài</a>
            </div>
          </div>
        `;
      });
      html += `</div></div>`;
    }
    resultsBox.innerHTML = html;
  }

  async function loadCatalog() {
    try {
      const res = await fetch('data/catalog.json');
      const categories = await res.json();
      let html = '';
      categories.forEach(cat => {
        const isLis = cat.type === 'listening';
        html += `<h2 style="margin-top: 30px;">${cat.category}</h2><div class="test-grid">`;
        cat.tests.forEach(test => {
          html += `
            <div class="test-card">
              <div>
                <span class="badge ${isLis ? 'badge-listening' : 'badge-reading'}">${isLis ? '🎧 Listening' : '📖 Reading'}</span>
                <h3 style="margin: 0 0 8px 0;">${test.title}</h3>
                <p style="font-size: 13.5px; color: var(--text-muted); margin: 0;">${test.desc}</p>
              </div>
              <a href="${test.url}" class="btn-start-test ${isLis ? 'lis' : ''}">
                ${isLis ? '🎧 Làm Bài Nghe' : '▶️ Làm Bài Đọc'}
              </a>
            </div>
          `;
        });
        html += `</div>`;
      });
      document.getElementById('catalogContainer').innerHTML = html;
    } catch (e) {
      document.getElementById('catalogContainer').innerHTML = `<p style="color:red; text-align:center;">Lỗi tải catalog đề thi!</p>`;
    }
  }

  checkAuthStatus();
</script>
</body>
</html>
